# Render blueprint. Import the repo at render.com/select-repo and it reads this.
#
# Secrets are deliberately NOT here — `sync: false` makes Render prompt for
# each one instead. A committed blueprint is a public file.
services:
  - type: web
    name: revenant-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: RAZORPAY_KEY_ID       # rzp_test_… only
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: API_KEY               # guards approve / deny
        sync: false
      - key: CORS_ORIGINS          # the Vercel URL, exactly
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: RAZORPAY_MODE
        value: test
      - key: ENABLE_DEV_ENDPOINTS  # replay endpoint stays off in public
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
